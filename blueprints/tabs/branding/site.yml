# ==========================================================
# Tabs :: Branding :: Site
# ==========================================================

label:
  "*": zeimoto-branding.tabs.branding
icon: palette
columns:
  columnTop:
    width: 4/6
    fields:
      palettes:
        type: structure
        label:
          "*": zeimoto-branding.fields.palettes
        translate: false
        empty:
          "*": zeimoto-branding.fields.palette-empty
        add:
          "*": zeimoto-branding.fields.palette-add
        fields:
          label:
            type: text
            label:
              "*": zeimoto-branding.fields.palette-name
            required: true
            placeholder:
              "*": zeimoto-branding.fields.palette-placeholder
          swatches:
            type: structure
            label:
              "*": zeimoto-branding.fields.swatches
            empty:
              "*": zeimoto-branding.fields.swatches-empty
            add:
              "*": zeimoto-branding.fields.swatches-add
            fields:
              name:
                type: text
                label:
                  "*": zeimoto-branding.fields.color-name
                required: true
                placeholder:
                  "*": zeimoto-branding.fields.color-placeholder
              value:
                type: color
                label:
                  "*": zeimoto-branding.fields.hex-value
                format: hex
                required: true
  columnBottom:
    width: 4/6
    fields:
      marks:
        type: structure
        label:
          "*": zeimoto-branding.fields.marks
        translate: false
        empty:
          "*": zeimoto-branding.fields.marks-empty
        add:
          "*": zeimoto-branding.fields.marks-add
        columns:
          name:
            width: 1/4
          slug:
            width: 1/4
          file:
            width: 2/4
        fields:
          name:
            type: text
            label:
              "*": zeimoto-branding.fields.name
            required: true
            placeholder:
              "*": zeimoto-branding.fields.name-placeholder
            width: 1/2
            autofocus: false
          slug:
            type: slug
            label:
              "*": zeimoto-branding.fields.slug
            sync: name
            required: true
            width: 1/2
          file:
            type: filepicker
            label:
              "*": zeimoto-branding.fields.file
            max: 1
            multiple: false
            required: true
            query: site.files
            uploads: image
            image:
              cover: true
              ratio: 1/1
